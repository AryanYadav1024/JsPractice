<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NodeListCreation</title>
</head>
<body style="background-color: black;">

</body>
<script>
    const div = document.createElement("div");
    console.log(div);
    div.className = "weekDays";
    div.id = Math.round((Math.random()*10+1));
    div.setAttribute("title","this is a div");
    // this doesn't go into memory to get value instead it will create a new attribute and set the value to it
    div.style.backgroundColor = "gray";
    div.style.padding = "1rem";
    div.style.border = "1px solid white";
    div.style.textAlign = "center";
    div.style.marginTop ="2rem";

    div.innerHTML ="hello world";
    /* now till here it will not show on page
       the div is created but not attached its indside the memory of the browser
       now we will attach it to the body of the page
    */
    document.body.appendChild(div); 
    // now the div will be attached to the body of the page and will be visible on the page
    

    /* 
       instead of using innerHTML as it overrides the content 
       meaning it brings the value from the memory and replaces the content of the div with it
    */

    

    // better way 
    const div2 = document.createElement("div");
    console.log(div2);
    div2.style.backgroundColor ="red";
    div2.id ="meow";
    div2.style.border="1px solid white";
    div2.style.textAlign="center";
    div2.setAttribute("title","balle balle")
    div2.style.padding="1rem";
    div2.style.color="white";

    // now what we will do is create a text node 
    const addText = document.createTextNode("Better Hello World");
    div2.appendChild(addText);
    document.body.appendChild(div2);
</script>
</html>
