<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSprojectPractice</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header id="header" class="header">
        <nav id="navBar">
            <a href="../06_Project.html" class="button">HOME</a>
            <a href="youtube.html" class="button">YOUTUBE CHANNEL</a>
        </nav>
    </header>
    <main>
        <div class="container main-container">
            <h1>GUESS THE NUMBER</h1>
            <p> You have to guess the number between 1 and 100!<br> you have 10 attempts.</p>
            <div class="container game-container">
                <form id="gameForm">
                    <label for ="guessInput">Enter your guess:</label>
                    <input type="number" id="guessInput" name="guess" placeholder="Enter your guess" required>
                    <button type="submit" class="button submit-answer">Submit</button>
                    <button type="button" id="resetButton" class="button reset-game">Reset</button>
                </form>
            <div class="container result-container">
                <p id="resultMessage">message: <span id="resultText"></span></p>
                <p id="previousGuesses">Previous guesses:<span id="guessList"></span> </p>
                <p id="attemptsLeft">Attempts left: <span id="attemptsCount">10</span></p>
            </div>
            </div>
        </div>
    </main>
</body>
</html>
