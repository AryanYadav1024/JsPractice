<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSprojectPractice</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header id="header" class="header">
        <nav id="navBar">
            <a href="../06_Project.html" class="button">HOME</a>
            <a href="youtube.html" class="button">YOUTUBE CHANNEL</a>
        </nav>
    </header>
    <main>
        <div class="container main-container">
            <h1>BMI CALCULATOR</h1>
            <div class="container bmi-calculator">
                <form id="bmiform">
                    <label for="weight">Weight (kg):</label>
                    <input type="number" id="weight" name="weight" required>
                    <label for="height">Height (cm):</label>
                    <input type="number" id="height" name="height" required>
                    <button type="submit" class="button submit-button">Calculate BMI</button>
                    <button type="reset" class="button reset-button">Reset</button>
                </form>
            </div>
            <div id="result" class="result"></div>
        </div>
    </main>
</body>
</html>
